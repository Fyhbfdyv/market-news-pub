<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market News · Daily Summaries</title>
  <!-- style.css supplies the shared palette + base controls; news.css adds
       the reading layout. Loading both keeps the vocab and news styles DRY. -->
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./news.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-mark"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4v4H7zM15 8h2m-2 4h2M7 16h10"/></svg></span>
        <div><span class="brand-eyebrow">Market News</span><h1>Daily Summaries</h1></div>
      </div>
      <div class="header-navigation">
        <nav class="page-nav" aria-label="Main navigation">
          <a class="cross-link" href="./index.html"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14m0-14C9 4 5 4 2 5v14c4-1 7 0 10 2 3-2 6-3 10-2V5c-3-1-7-1-10 2Z"/></svg><span>Vocab Trainer</span></a>
          <a class="cross-link" href="./stats.html"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 15v-4m5 4V7m5 8V4"/></svg><span>Progress</span></a>
          <a class="cross-link" href="./news.html" aria-current="page"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4v4H7zM15 8h2m-2 4h2M7 16h10"/></svg><span>Daily Summaries</span></a>
        </nav>
        <div class="header-tools" role="group" aria-label="Account and settings"></div>
      </div>
    </div>
    <div class="controls">
      <label class="control">
        <span>Source</span>
        <nav class="modes" id="source-nav">
          <button data-source="all" class="active">All</button>
          <button data-source="b">Bloomberg</button>
          <button data-source="c">CNBC</button>
        </nav>
      </label>
      <label class="control">
        <span>Date</span>
        <div class="picker">
          <button id="prev-day" class="btn-ghost nav-arrow" title="Newer">‹</button>
          <select id="report-select"></select>
          <button id="next-day" class="btn-ghost nav-arrow" title="Older">›</button>
        </div>
      </label>
    </div>
  </header>

  <main id="layout">
    <aside id="toc" class="toc" aria-label="Themes in this report"></aside>
    <article id="report" class="report markdown-body">
      <p class="status" id="status">Loading summaries…</p>
    </article>
  </main>

  <footer class="app-footer">
    <span id="footer-info"></span>
  </footer>

  <!-- Vendored markdown renderer (pinned marked v12), then the app. -->
  <script src="./marked.min.js"></script>
  <!-- Shared voice settings (injects the ⚙ panel); load before news.js so
       toggleSpeech can read the user's chosen voice. -->
  <script src="./voice-prefs.js" defer></script>
  <script src="./news.js" defer></script>
</body>
</html>
