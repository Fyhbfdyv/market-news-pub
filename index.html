<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market News · Vocab Trainer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-mark"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14m0-14C9 4 5 4 2 5v14c4-1 7 0 10 2 3-2 6-3 10-2V5c-3-1-7-1-10 2Z"/></svg></span>
        <div><span class="brand-eyebrow">Market News</span><h1>Vocab Trainer</h1></div>
      </div>
      <div class="header-navigation">
        <nav class="page-nav" aria-label="Main navigation">
          <a class="cross-link" href="./index.html" aria-current="page"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14m0-14C9 4 5 4 2 5v14c4-1 7 0 10 2 3-2 6-3 10-2V5c-3-1-7-1-10 2Z"/></svg><span>Vocab Trainer</span></a>
          <a class="cross-link" href="./stats.html"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 15v-4m5 4V7m5 8V4"/></svg><span>Progress</span></a>
          <a class="cross-link" href="./news.html"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4v4H7zM15 8h2m-2 4h2M7 16h10"/></svg><span>Daily Summaries</span></a>
        </nav>
        <div class="header-tools" role="group" aria-label="Account and settings"></div>
      </div>
    </div>
    <div class="controls">
      <label class="control">
        <span>Deck</span>
        <div class="picker">
          <button id="prev-deck" class="btn-ghost nav-arrow" title="Newer deck">‹</button>
          <select id="deck-select"></select>
          <button id="next-deck" class="btn-ghost nav-arrow" title="Older deck">›</button>
        </div>
      </label>
      <button id="manage-favorites" class="btn" type="button">Manage favorites</button>
      <nav class="modes" id="mode-nav">
        <button data-mode="flashcard" class="active">Flashcard</button>
        <button data-mode="quiz">Quiz</button>
        <button data-mode="fill">Fill blanks</button>
        <button data-mode="listening">Listening</button>
        <button data-mode="shadowing">Shadowing</button>
      </nav>
    </div>
  </header>

  <main id="stage">
    <!-- Each mode renders its UI into #stage. -->
    <p class="status" id="status">Loading vocabulary…</p>
  </main>

  <footer class="app-footer">
    <span id="footer-info"></span>
  </footer>

  <!-- The SDK loads before app.js imports the shared session and study log. -->
  <script src="./supabase.min.js" defer></script>

  <!-- Shared voice settings (injects the ⚙ panel); load before app.js so
       Speech.voiceFor can read the user's choice. -->
  <script src="./voice-prefs.js" defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
